        // Default Authorized Manager Accounts
        const PRIMARY_MANAGER = "hayashirika05@gmail.com";
        const LOCAL_TRACKS_KEY = "emostream_r2_tracks_v1";
        const LOCAL_FAVORITES_KEY = "emostream_r2_favorites_v1";
        const LOCAL_PLAYLISTS_KEY = "emostream_r2_playlists_v1";
        const LOCAL_AVATAR_KEY = "emostream_manager_avatar_v1";

        const mediaDb = {
            open() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('EmoStreamMediaDB', 1);
                    request.onupgradeneeded = () => {
                        if (!request.result.objectStoreNames.contains('media')) request.result.createObjectStore('media');
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            async put(id, blob) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('media', 'readwrite');
                    tx.objectStore('media').put(blob, id);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            },
            async get(id) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const request = db.transaction('media').objectStore('media').get(id);
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                });
            },
            async remove(id) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('media', 'readwrite');
                    tx.objectStore('media').delete(id);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            },
            async keys() {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const request = db.transaction('media').objectStore('media').getAllKeys();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }
        };

        // Sample Catalog Seed (Used if database is fresh)

        function inferMediaType(value, fallback = 'audio') {
            const lower = String(value || '').toLowerCase().split('?')[0].split('#')[0];
            const videoExtensions = ['.mp4', '.webm', '.mov', '.m4v', '.ogv', '.avi', '.mkv'];
            const audioExtensions = ['.mp3', '.wav', '.m4a', '.aac', '.ogg', '.flac', '.opus'];
            if (videoExtensions.some(extension => lower.endsWith(extension))) return 'video';
            if (audioExtensions.some(extension => lower.endsWith(extension))) return 'audio';
            return fallback === 'video' ? 'video' : 'audio';
        }

        function normalizeTrack(track) {
            if (!track) return track;
            const source = track.localFileName || track.url || track.title || '';
            return { ...track, type: inferMediaType(source, track.type) };
        }

        function App() {
            // Auth States
            const [user, setUser] = useState(null);
            const [guestId] = useState(() => 'guest_' + Math.random().toString(36).substring(2, 9));
            const [authLoading, setAuthLoading] = useState(true);
            const [emailInput, setEmailInput] = useState('');
            const [passwordInput, setPasswordInput] = useState('');
            const [authError, setAuthError] = useState('');
            const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [managers, setManagers] = useState([PRIMARY_MANAGER]);

            // Application Data States
            const [tracks, setTracks] = useState(() => {
                try { const value = JSON.parse(localStorage.getItem(LOCAL_TRACKS_KEY) || 'null'); return Array.isArray(value) && value.length ? value.map(normalizeTrack) : SAMPLE_TRACKS; }

            });
            const [favorites, setFavorites] = useState(() => {
                try { const value = JSON.parse(localStorage.getItem(LOCAL_FAVORITES_KEY) || '[]'); return Array.isArray(value) ? value : []; }
                catch { return []; }
            });
            const [playlists, setPlaylists] = useState(() => {
                try { const value = JSON.parse(localStorage.getItem(LOCAL_PLAYLISTS_KEY) || '[]'); return Array.isArray(value) ? value : []; }
                catch { return []; }
            });
            const [activeTab, setActiveTab] = useState('home'); // home, search, favorites, playlists, manager, r2guide
            
            // Queue & Context Navigation State
            const [activeQueue, setActiveQueue] = useState(null); // array of tracks
            const [activeQueueName, setActiveQueueName] = useState('All Tracks');

            // Search & Filter States
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedGenre, setSelectedGenre] = useState('All');

            // Player Logic States
            const [currentTrack, setCurrentTrack] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.8);
            const [isMuted, setIsMuted] = useState(false);
            const [repeatMode, setRepeatMode] = useState('off'); // 'off', 'all' (playlist loop), 'one' (single track loop)
            const [isShuffle, setIsShuffle] = useState(false);
            const [showVideoModal, setShowVideoModal] = useState(false);

            // Cloudflare R2 Settings State
            const [r2Config, setR2Config] = useState(() => ({
                workerUrl: localStorage.getItem('emostream_r2_worker_url') || '',
                uploadToken: sessionStorage.getItem('emostream_r2_upload_token') || ''
            }));

            // UI Modal States
            const [newPlaylistName, setNewPlaylistName] = useState('');
            const [showCreatePlaylist, setShowCreatePlaylist] = useState(false);
            const [selectedTrackForPlaylist, setSelectedTrackForPlaylist] = useState(null);
            const [newManagerEmail, setNewManagerEmail] = useState('');

            // Upload Form State
            const [uploadForm, setUploadForm] = useState({
                title: '',
                artist: '',
                album: '',
                genre: 'J-Pop',
                type: 'audio',
                url: '',
                cover: ''
            });
            const [uploading, setUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploadStatus, setUploadStatus] = useState('');
            const [r2TestStatus, setR2TestStatus] = useState('');
            const [selectedLocalFile, setSelectedLocalFile] = useState(null);
            const [avatar, setAvatar] = useState(() => localStorage.getItem(LOCAL_AVATAR_KEY) || '');

            // References
            const audioRef = useRef(null);
            const videoRef = useRef(null);
            const mediaFileRef = useRef(null);
            const avatarFileRef = useRef(null);
            const activeUploadTaskRef = useRef(null);
            const uploadCancelledRef = useRef(false);

            useEffect(() => {
                const restoreLocalFiles = async () => {
                    const saved = JSON.parse(localStorage.getItem(LOCAL_TRACKS_KEY) || '[]');
                    if (!Array.isArray(saved)) return;
                    const restored = await Promise.all(saved.map(async track => {
                        if (!track.localBlobId) return normalizeTrack(track);
                        try {
                            const blob = await mediaDb.get(track.localBlobId);
                            return blob ? normalizeTrack({ ...track, url: URL.createObjectURL(blob), unavailable: false }) : normalizeTrack({ ...track, unavailable: true });
                        } catch (error) {
                            return { ...track, unavailable: true };
                        }
                    }));
                    const knownBlobIds = new Set(restored.map(track => track.localBlobId).filter(Boolean));
                    const recovered = [];
                    try {
                        const keys = await mediaDb.keys();
                        for (const key of keys) {
                            if (knownBlobIds.has(key)) continue;
                            const blob = await mediaDb.get(key);
                            if (!blob) continue;
                            const filename = blob.name || `Recovered media ${recovered.length + 1}`;
                            recovered.push(normalizeTrack({
                                id: `recovered-${String(key)}`,
                                title: filename.replace(/\.[^.]+$/, ''),
                                artist: 'Recovered upload',
                                album: 'Browser recovery',
                                genre: 'Other',
                                type: inferMediaType(filename, blob.type?.startsWith('video/') ? 'video' : 'audio'),
                                url: URL.createObjectURL(blob),
                                cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80',
                                localBlobId: key,
                                localFileName: filename,
                                timestamp: Date.now() - recovered.length,
                                recovered: true
                            }));
                        }
                    } catch (error) {
                        console.warn('Browser media recovery failed:', error);
                    }
                    if (restored.length || recovered.length) {
                        setTracks(previous => [...restored, ...recovered, ...previous].filter((track, index, list) => list.findIndex(item => item.id === track.id) === index));
                    }
                };
                restoreLocalFiles();
            }, []);

            useEffect(() => { localStorage.setItem(LOCAL_TRACKS_KEY, JSON.stringify(tracks)); }, [tracks]);
            useEffect(() => { localStorage.setItem(LOCAL_FAVORITES_KEY, JSON.stringify(favorites)); }, [favorites]);
            useEffect(() => { localStorage.setItem(LOCAL_PLAYLISTS_KEY, JSON.stringify(playlists)); }, [playlists]);
            useEffect(() => {
                const timeout = setTimeout(() => {
                    if (!window.FB) {
                        setAuthError('Firebase could not load. Check the internet connection and Firebase configuration.');
                        setAuthLoading(false);
                    }
                }, 5000);
                return () => clearTimeout(timeout);
            }, []);

            useEffect(() => {
                if (!window.FB) return;
                const { auth, onAuthStateChanged, signInWithCustomToken, signInAnonymously } = window.FB;

                // Initial authentication bootstrap
                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token && typeof signInWithCustomToken === 'function') {
                        try {
                            await signInWithCustomToken(auth, __initial_auth_token);
                            return;
                        } catch (e) {
                            console.warn("Custom token auth failed, trying fallback", e);

                let nextIndex;

                // 2. Shuffle mode
                if (isShuffle) {
                    if (queue.length === 1) {
                        nextIndex = 0;
                    } else {
                        do {
                            nextIndex = Math.floor(Math.random() * queue.length);
                        } while (nextIndex === currentIndex && queue.length > 1);
                    }
                } else {
                    nextIndex = currentIndex + 1;
                }

                // 3. Queue / Playlist Boundary check
                if (nextIndex >= queue.length) {
                    // Playlist Auto-repeat ('all')

                        nextIndex = 0;

                        setIsPlaying(false);
                        return;
                    }

                    nextIndex = Math.floor(Math.random() * queue.length);
                } else {
                    nextIndex = currentIndex + 1;

                playTrack(queue[nextIndex]);

                    if (window.FB && user && !user.isGuest) {
                        try {
                            const { storage, storageRef, uploadBytesResumable, getDownloadURL, db, appId, doc, setDoc } = window.FB;
                            const path = `manager-avatars/${user.uid}/avatar-${Date.now()}`;
                            const task = uploadBytesResumable(storageRef(storage, path), file, { contentType: file.type });
                            await new Promise((resolve, reject) => task.on('state_changed', null, reject, resolve));
                            const avatarUrl = await getDownloadURL(task.snapshot.ref);
                            await setDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'settings'), { avatarUrl, storagePath: path, updatedAt: Date.now() });
                            setAvatar(avatarUrl);
                            localStorage.setItem(LOCAL_AVATAR_KEY, avatarUrl);
                        } catch (error) {
                            console.warn('Avatar saved locally; cloud sync failed:', error);
                        }
                    }
                };
                reader.readAsDataURL(file);
            };

            const filteredTracks = useMemo(() => {
                return tracks.filter(t => {
                    const matchesSearch = searchQuery === '' || 
                        t.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        t.artist.toLowerCase().includes(searchQuery.toLowerCase()) ||
                        (t.album && t.album.toLowerCase().includes(searchQuery.toLowerCase()));
                    
                    const matchesGenre = selectedGenre === 'All' || t.genre === selectedGenre;

                    return matchesSearch && matchesGenre;
                });
            }, [tracks, searchQuery, selectedGenre]);

            const genresList = ['All', 'City Pop', 'J-Pop', 'Synthwave', 'Acoustic', 'Lo-Fi', 'Anime'];

            // Format helper for seconds to MM:SS
            const formatTime = (secs) => {
                if (isNaN(secs)) return "00:00";
                const m = Math.floor(secs / 60);
                const s = Math.floor(secs % 60);
                return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
            };

            return (
                <div className="flex h-screen w-screen overflow-hidden bg-[#090d16] text-slate-100">

                    {/* Full application account gate: no site function is usable until
                        Firebase verifies the registered password and manager email. */}
                    {!authLoading && !isManager && (
                        <div className="fixed inset-0 z-[100] bg-[#090d16] flex items-center justify-center p-5 overflow-auto">
                            <div className="w-full max-w-md rounded-3xl border border-slate-700 bg-slate-900 p-7 shadow-2xl">
                                <div className="w-14 h-14 rounded-2xl bg-gradient-to-tr from-brand-500 to-brand-accent flex items-center justify-center mx-auto mb-5 glow-effect">
                                    <Icon name="shield-check" className="w-8 h-8 text-slate-950" />
                                </div>
                                <h1 className="text-2xl font-extrabold text-center">EmoStream Manager Gate</h1>
                                <p className="text-sm text-slate-400 text-center mt-2 leading-relaxed">Only {PRIMARY_MANAGER} and manager accounts assigned by the primary manager can sign in and use this website.</p>
                                <form onSubmit={handleAuth} className="space-y-4 mt-6">
                                    <div><label className="text-xs font-bold text-slate-400">Manager Email / Gmail</label><input type="email" required value={emailInput} onChange={e => setEmailInput(e.target.value)} className="mt-1.5 w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm" placeholder="manager@gmail.com" /></div>
                                    <div><label className="text-xs font-bold text-slate-400">Registered password</label><input type="password" required minLength="6" value={passwordInput} onChange={e => setPasswordInput(e.target.value)} className="mt-1.5 w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm" placeholder="••••••••" /></div>
                                    {authError && <div className="rounded-xl border border-rose-500/30 bg-rose-500/10 p-3 text-xs text-rose-300 leading-relaxed">{authError}</div>}
                                    <button className="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-extrabold py-3 rounded-xl">{authMode === 'login' ? 'Sign in securely' : 'Register approved manager'}</button>
                                </form>
                                <button onClick={() => { setAuthMode(authMode === 'login' ? 'register' : 'login'); setAuthError(''); }} className="w-full mt-4 text-xs font-bold text-brand-400 hover:underline">{authMode === 'login' ? 'First time? Register an approved manager account' : 'Already registered? Return to sign in'}</button>
                                <div className="mt-6 pt-5 border-t border-slate-800 text-[11px] text-slate-500 leading-relaxed"><b className="text-slate-400">Account policy:</b> an email must first appear on the manager allowlist. The password is verified by Firebase Authentication and is never stored in this webpage.</div>
                            </div>
                        </div>
                    )}
                    
                    {/* Audio Engine element */}
                    <audio 
                        ref={audioRef}
                        src={currentTrack?.type === 'audio' ? currentTrack.url : ''}
                        onTimeUpdate={handleTimeUpdate}
                        onEnded={handleTrackEnded}
                    />

                    {/* Left Navigation Sidebar */}
                    <aside className="w-64 bg-[#0f172a] border-r border-slate-800/80 flex flex-col justify-between hidden md:flex shrink-0">
                        <div>
                            {/* Brand Header */}
                            <div className="p-6 flex items-center space-x-3 border-b border-slate-800/60">
                                <div className="w-10 h-10 rounded-xl bg-gradient-to-tr from-brand-500 to-brand-accent flex items-center justify-center glow-effect">
                                    <Icon name="waves" className="w-6 h-6 text-slate-900" />
                                </div>
                                <div>
                                    <h1 className="font-extrabold text-lg tracking-tight bg-gradient-to-r from-white via-slate-200 to-slate-400 bg-clip-text text-transparent">
                                        R2 Stream Hub
                                    </h1>
                                    <span className="text-[10px] uppercase font-bold tracking-widest text-brand-500 bg-brand-500/10 px-2 py-0.5 rounded-full border border-brand-500/20">
                                        Cloudflare R2
                                    </span>
                                </div>
                            </div>

                            {/* Main Navigation Menu */}
                            <nav className="p-4 space-y-1 text-sm font-medium">
                                <button 
                                    onClick={() => setActiveTab('home')} 
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'home' ? 'bg-brand-500/15 text-brand-500 border border-brand-500/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}
                                >
                                    <Icon name="disc" className="w-5 h-5" />
                                    <span>Home & Discover</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('search')} 
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'search' ? 'bg-brand-500/15 text-brand-500 border border-brand-500/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}
                                >
                                    <Icon name="search" className="w-5 h-5" />
                                    <span>Search Tracks</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('favorites')} 
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'favorites' ? 'bg-brand-500/15 text-brand-500 border border-brand-500/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}
                                >
                                    <Icon name="heart" className="w-5 h-5" />
                                    <span>Favorites</span>
                                    {favorites.length > 0 && (
                                        <span className="ml-auto bg-rose-500/20 text-rose-400 text-xs px-2 py-0.5 rounded-full font-bold">
                                            {favorites.length}
                                        </span>
                                    )}
                                </button>

                                <button 
                                    onClick={() => setActiveTab('playlists')} 
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'playlists' ? 'bg-brand-500/15 text-brand-500 border border-brand-500/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}
                                >
                                    <Icon name="list-music" className="w-5 h-5" />
                                    <span>My Playlists</span>
                                </button>

                                <div className="pt-4 pb-2">
                                    <p className="px-4 text-[11px] font-semibold text-slate-500 uppercase tracking-wider">Manager Studio</p>
                                </div>

                                <button 
                                    onClick={() => setActiveTab('manager')} 
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'manager' ? 'bg-brand-purple/15 text-brand-purple border border-brand-purple/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}
                                >
                                    <Icon name="upload-cloud" className="w-5 h-5" />
                                    <span>R2 Song Studio</span>
                                </button>

                                <button 
                                    onClick={() => setActiveTab('r2guide')} 
                                    className={`w-full flex items-center space-x-3 px-4 py-3 rounded-xl transition ${activeTab === 'r2guide' ? 'bg-brand-accent/15 text-brand-accent border border-brand-accent/30' : 'text-slate-400 hover:text-white hover:bg-slate-800/50'}`}
                                >
                                    <Icon name="folder-git-2" className="w-5 h-5" />
                                    <span>Cyberduck & R2 Setup</span>
                                </button>
                            </nav>
                        </div>

                        {/* Account Footer */}
                        <div className="p-4 border-t border-slate-800/60 bg-slate-900/40">
                            {user && user.email ? (
                                <div className="flex items-center justify-between">
                                    <div className="flex items-center space-x-3 overflow-hidden">
                                        <button onClick={() => avatarFileRef.current?.click()} title="Change avatar" className="w-9 h-9 rounded-full bg-slate-700 flex items-center justify-center font-bold text-xs text-brand-500 shrink-0 overflow-hidden ring-2 ring-transparent hover:ring-brand-500 transition">
                                            {avatar ? <img src={avatar} alt="Manager avatar" className="w-full h-full object-cover" /> : user.email.substring(0, 2).toUpperCase()}
                                        </button>
                                        <input ref={avatarFileRef} type="file" accept="image/png,image/jpeg,image/webp,image/gif" onChange={handleAvatarUpload} className="hidden" />
                                        <div className="truncate text-xs">
                                            <p className="font-semibold text-slate-200 truncate">{user.email}</p>
                                            <p className="text-[10px] text-brand-500">{isManager ? 'Manager Account' : 'Standard User'}</p>
                                        </div>
                                    </div>
                                    <button 
                                        onClick={handleLogout}
                                        title="Sign Out"
                                        className="text-slate-400 hover:text-rose-400 p-1.5 rounded-lg hover:bg-slate-800 transition"
                                    >
                                        <Icon name="log-out" className="w-4 h-4" />
                                    </button>
                                </div>
                            ) : (
                                <button 
                                    onClick={() => {
                                        setAuthMode('login');
                                        setAuthError('');
                                        setShowAuthModal(true);
                                    }}
                                    className="w-full py-2 bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold rounded-xl text-xs flex items-center justify-center space-x-2 shadow-lg transition"
                                >
                                    <Icon name="lock" className="w-3.5 h-3.5" />
                                    <span>Sign In / Manager Gate</span>
                                </button>
                            )}
                        </div>
                    </aside>

                    {/* Main Content Workspace */}
                    <main className="flex-1 flex flex-col min-w-0 overflow-hidden relative">
                        
                        {/* Top Header Bar */}
                        <header className="h-16 border-b border-slate-800/80 px-6 flex items-center justify-between bg-[#0f172a]/60 backdrop-blur-md z-10 shrink-0">
                            
                            {/* Mobile Hamburger / Quick Tab switch */}
                            <div className="flex items-center space-x-3 md:hidden">
                                <span className="font-bold text-brand-500 text-sm">R2 Hub</span>
                            </div>

                            {/* Global Quick Search Header */}
                            <div className="relative max-w-md w-full">
                                <Icon name="search" className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                                <input 
                                    type="text"
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    placeholder="Search song title, artist, or album..."
                                    className="w-full bg-slate-800/60 border border-slate-700/60 rounded-xl pl-10 pr-4 py-1.5 text-xs text-slate-200 placeholder-slate-400 focus:outline-none focus:border-brand-500 transition"
                                />
                                {searchQuery && (
                                    <button 
                                        onClick={() => setSearchQuery('')}
                                        className="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-white text-xs"
                                    >
                                        ✕
                                    </button>
                                )}
                            </div>

                            {/* Header Quick Stats / Controls */}
                            <div className="flex items-center space-x-3">
                                {isManager ? (
                                    <span className="hidden sm:inline-flex items-center space-x-1.5 text-xs bg-purple-500/10 border border-purple-500/20 text-purple-400 px-3 py-1 rounded-full font-medium">
                                        <Icon name="shield-check" className="w-3.5 h-3.5" />
                                        <span>Manager Access</span>
                                    </span>
                                ) : (
                                    <button 
                                        onClick={() => {
                                            setAuthMode('login');
                                            setAuthError('');
                                            setShowAuthModal(true);
                                        }}
                                        className="hidden sm:inline-flex items-center space-x-1.5 text-xs bg-brand-500/10 border border-brand-500/30 text-brand-400 hover:bg-brand-500/20 px-3 py-1 rounded-full font-semibold transition"
                                    >
                                        <Icon name="key-round" className="w-3.5 h-3.5" />
                                        <span>Manager Gate</span>
                                    </button>
                                )}
                            </div>
                        </header>

                        {/* Page Content Render Switcher */}
                        <div className="flex-1 overflow-y-auto p-6 pb-32">
                            
                            {/* HOME TAB */}
                            {activeTab === 'home' && (
                                <div className="space-y-8 max-w-7xl mx-auto">
                                    
                                    {/* Hero Banner */}
                                    <div className="relative rounded-3xl p-8 bg-gradient-to-r from-emerald-950/80 via-slate-900 to-indigo-950/80 border border-slate-800 overflow-hidden shadow-2xl">
                                        <div className="absolute right-0 top-0 bottom-0 w-1/2 opacity-20 pointer-events-none bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-brand-500 via-transparent to-transparent"></div>
                                        <div className="relative z-10 max-w-xl space-y-4">
                                            <span className="text-xs font-extrabold uppercase tracking-widest text-brand-500 bg-brand-500/10 border border-brand-500/20 px-3 py-1 rounded-full">
                                                Cloudflare R2 Media Integration
                                            </span>
                                            <h2 className="text-3xl md:text-4xl font-extrabold text-white tracking-tight leading-tight">
                                                Stream High Quality Video & Audio Direct from R2
                                            </h2>
                                            <p className="text-slate-300 text-sm leading-relaxed">
                                                Upload, store, and stream your entire music library using Cyberduck or S3 API directly to Cloudflare R2 object storage.
                                            </p>
                                            <div className="flex items-center space-x-4 pt-2">
                                                <button 
                                                    onClick={() => tracks.length > 0 && playTrack(tracks[0])}
                                                    className="bg-brand-500 hover:bg-brand-600 text-slate-950 font-extrabold px-6 py-2.5 rounded-xl text-sm flex items-center space-x-2 shadow-lg transition"
                                                >
                                                    <Icon name="play" className="w-4 h-4" fill="currentColor" />
                                                    <span>Play Featured Track</span>
                                                </button>
                                                <button 
                                                    onClick={() => setActiveTab('manager')}
                                                    className="bg-slate-800/80 hover:bg-slate-700 text-slate-200 border border-slate-700 px-5 py-2.5 rounded-xl text-sm font-semibold transition"
                                                >
                                                    Upload to R2
                                                </button>
                                            </div>
                                        </div>
                                    </div>

                                    {/* Genre Filter Bar */}
                                    <div className="flex items-center space-x-2 overflow-x-auto pb-2 scrollbar-none">
                                        {genresList.map(genre => (
                                            <button
                                                key={genre}
                                                onClick={() => setSelectedGenre(genre)}
                                                className={`px-4 py-2 rounded-xl text-xs font-semibold whitespace-nowrap transition ${selectedGenre === genre ? 'bg-brand-500 text-slate-950 font-extrabold' : 'bg-slate-800/60 text-slate-300 hover:bg-slate-700'}`}
                                            >
                                                {genre}
                                            </button>
                                        ))}
                                    </div>

                                    {/* Tracks Grid */}
                                    <div className="space-y-4">
                                        <div className="flex items-center justify-between">
                                            <h3 className="text-lg font-bold text-slate-100 flex items-center space-x-2">
                                                <Icon name="sparkles" className="w-5 h-5 text-brand-500" />
                                                <span>Track Library</span>
                                            </h3>
                                            <span className="text-xs text-slate-400 font-medium">{filteredTracks.length} Tracks Available</span>
                                        </div>

                                        <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
                                            {filteredTracks.map(track => {
                                                const isCurrent = currentTrack?.id === track.id;
                                                const isFav = favorites.includes(track.id);

                                                return (
                                                    <div 
                                                        key={track.id}
                                                        className={`group relative rounded-2xl p-4 bg-slate-900/60 border ${isCurrent ? 'border-brand-500/60 bg-brand-500/5' : 'border-slate-800 hover:border-slate-700'} transition duration-200 flex flex-col justify-between`}
                                                    >
                                                        <div>
                                                            {/* Cover Image */}
                                                            <div className="relative aspect-square rounded-xl overflow-hidden mb-3 bg-slate-800">
                                                                <img 
                                                                    src={track.cover} 
                                                                    alt={track.title}
                                                                    className="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                                                                    onError={(e) => { e.target.src = 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80'; }}
                                                                />
                                                                
                                                                {/* Overlay Play Button */}
                                                                <button 
                                                                    onClick={() => playTrack(track)}
                                                                    className={`absolute inset-0 bg-slate-950/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition ${isCurrent ? 'opacity-100 bg-slate-950/60' : ''}`}
                                                                >
                                                                    <div className="w-12 h-12 rounded-full bg-brand-500 text-slate-950 flex items-center justify-center shadow-lg transform group-hover:scale-110 transition">
                                                                        <Icon name={isCurrent && isPlaying ? "pause" : "play"} className="w-6 h-6" fill="currentColor" />
                                                                    </div>
                                                                </button>

                                                                {/* Type Badge */}
                                                                <span className={`absolute top-2 right-2 text-[10px] font-extrabold uppercase px-2 py-0.5 rounded-md backdrop-blur-md ${track.type === 'video' ? 'bg-indigo-500/80 text-white' : 'bg-slate-900/80 text-brand-400'}`}>
                                                                    {track.type}
                                                                </span>
                                                            </div>

                                                            {/* Track Meta */}
                                                            <h4 className="font-bold text-sm text-slate-100 truncate group-hover:text-brand-400 transition">
                                                                {track.title}
                                                            </h4>
                                                            <p className="text-xs text-slate-400 truncate mt-0.5">{track.artist}</p>
                                                            <p className="text-[11px] text-slate-500 truncate mt-0.5">{track.album || track.genre}</p>
                                                        </div>

                                                        {/* Track Card Bottom Actions */}
                                                        <div className="flex items-center justify-between pt-3 mt-3 border-t border-slate-800/60 text-xs">
                                                            <span className="text-slate-500 font-mono">{track.duration}</span>
                                                            
                                                            <div className="flex items-center space-x-2">
                                                                <button 
                                                                    onClick={() => toggleFavorite(track.id)}
                                                                    className={`p-1.5 rounded-lg hover:bg-slate-800 transition ${isFav ? 'text-rose-500' : 'text-slate-500 hover:text-slate-300'}`}
                                                                    title="Favorite Track"
                                                                >
                                                                    <Icon name="heart" className="w-4 h-4" fill={isFav ? "currentColor" : "none"} />
                                                                </button>

                                                                <button 
                                                                    onClick={() => setSelectedTrackForPlaylist(track)}
                                                                    className="p-1.5 rounded-lg text-slate-500 hover:text-slate-300 hover:bg-slate-800 transition"
                                                                    title="Add to Playlist"
                                                                >
                                                                    <Icon name="plus-circle" className="w-4 h-4" />
                                                                </button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* SEARCH & BROWSE TAB */}
                            {activeTab === 'search' && (
                                <div className="space-y-6 max-w-5xl mx-auto">
                                    <div className="bg-slate-900/60 rounded-2xl p-6 border border-slate-800">
                                        <h3 className="text-xl font-bold mb-4 flex items-center space-x-2">
                                            <Icon name="search" className="w-5 h-5 text-brand-500" />
                                            <span>Search Artists & Tracks</span>
                                        </h3>
                                        
                                        <div className="relative">
                                            <input 
                                                type="text" 
                                                value={searchQuery}
                                                onChange={(e) => setSearchQuery(e.target.value)}
                                                placeholder="Type artist name (e.g., Hayashi Rika) or song title..."
                                                className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 pl-11 text-slate-100 placeholder-slate-400 focus:outline-none focus:border-brand-500 transition"
                                            />
                                            <Icon name="search" className="w-5 h-5 absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400" />
                                        </div>
                                    </div>

                                    {/* Search Results List */}
                                    <div className="space-y-2">
                                        {filteredTracks.map((track, idx) => (
                                            <div 
                                                key={track.id}
                                                className="flex items-center justify-between p-3 rounded-xl bg-slate-900/40 hover:bg-slate-800/60 border border-slate-800/80 transition"
                                            >
                                                <div className="flex items-center space-x-4">
                                                    <span className="w-6 text-center font-mono text-xs text-slate-500">{idx + 1}</span>
                                                    <img src={track.cover} className="w-10 h-10 rounded-lg object-cover" />
                                                    <div>
                                                        <h4 className="font-bold text-sm text-slate-200">{track.title}</h4>
                                                        <p className="text-xs text-slate-400">{track.artist} • <span className="text-brand-500">{track.genre}</span></p>
                                                    </div>
                                                </div>

                                                <div className="flex items-center space-x-3">
                                                    <span className="text-xs text-slate-500 font-mono">{track.duration}</span>
                                                    <button 
                                                        onClick={() => playTrack(track)}
                                                        className="w-9 h-9 rounded-full bg-brand-500 text-slate-950 flex items-center justify-center hover:scale-105 transition"
                                                    >
                                                        <Icon name="play" className="w-4 h-4" fill="currentColor" />
                                                    </button>
                                                </div>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* FAVORITES TAB */}
                            {activeTab === 'favorites' && (
                                <div className="space-y-6 max-w-5xl mx-auto">
                                    <div className="flex items-center space-x-3 pb-4 border-b border-slate-800">
                                        <div className="w-12 h-12 rounded-2xl bg-rose-500/10 border border-rose-500/20 flex items-center justify-center text-rose-500">
                                            <Icon name="heart" className="w-6 h-6" fill="currentColor" />
                                        </div>
                                        <div>
                                            <h2 className="text-2xl font-bold">Your Favorite Tracks</h2>
                                            <p className="text-xs text-slate-400">{favorites.length} Saved tracks in your Firestore profile</p>
                                        </div>
                                    </div>

                                    {favorites.length === 0 ? (
                                        <div className="text-center py-16 bg-slate-900/30 rounded-2xl border border-dashed border-slate-800">
                                            <Icon name="heart-off" className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                                            <p className="text-slate-400 text-sm">No favorite tracks added yet.</p>
                                            <button 
                                                onClick={() => setActiveTab('home')}
                                                className="mt-4 text-xs font-bold text-brand-500 hover:underline"
                                            >
                                                Browse Catalog →
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="space-y-2">
                                            {tracks.filter(t => favorites.includes(t.id)).map(track => (
                                                <div key={track.id} className="flex items-center justify-between p-3 rounded-xl bg-slate-900/50 border border-slate-800">
                                                    <div className="flex items-center space-x-3">
                                                        <img src={track.cover} className="w-12 h-12 rounded-xl object-cover" />
                                                        <div>
                                                            <h4 className="font-bold text-sm">{track.title}</h4>
                                                            <p className="text-xs text-slate-400">{track.artist}</p>
                                                        </div>
                                                    </div>
                                                    <div className="flex items-center space-x-3">
                                                        <button onClick={() => toggleFavorite(track.id)} className="text-rose-500 p-2">
                                                            <Icon name="heart" className="w-5 h-5" fill="currentColor" />
                                                        </button>
                                                        <button onClick={() => playTrack(track)} className="bg-brand-500 p-2 rounded-xl text-slate-950">
                                                            <Icon name="play" className="w-4 h-4" fill="currentColor" />
                                                        </button>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* CUSTOM PLAYLISTS TAB */}
                            {activeTab === 'playlists' && (
                                <div className="space-y-6 max-w-5xl mx-auto">
                                    <div className="flex items-center justify-between pb-4 border-b border-slate-800">
                                        <div className="flex items-center space-x-3">
                                            <div className="w-12 h-12 rounded-2xl bg-brand-500/10 border border-brand-500/20 flex items-center justify-center text-brand-500">
                                                <Icon name="list-music" className="w-6 h-6" />
                                            </div>
                                            <div>
                                                <h2 className="text-2xl font-bold">Custom Playlists</h2>
                                                <p className="text-xs text-slate-400">Organize and loop your favorite songs with Auto-Repeat</p>
                                            </div>
                                        </div>
                                        <button 
                                            onClick={() => setShowCreatePlaylist(true)}
                                            className="bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs flex items-center space-x-2 transition shadow-lg"
                                        >
                                            <Icon name="plus" className="w-4 h-4" />
                                            <span>Create Playlist</span>
                                        </button>
                                    </div>

                                    {playlists.length === 0 ? (
                                        <div className="text-center py-16 bg-slate-900/30 rounded-2xl border border-dashed border-slate-800">
                                            <Icon name="list-music" className="w-12 h-12 text-slate-600 mx-auto mb-3" />
                                            <p className="text-slate-400 text-sm">No custom playlists created yet.</p>
                                            <button 
                                                onClick={() => setShowCreatePlaylist(true)}
                                                className="mt-4 text-xs font-bold text-brand-500 hover:underline"
                                            >
                                                Create Your First Playlist +
                                            </button>
                                        </div>
                                    ) : (
                                        <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                            {playlists.map(pl => {
                                                const plTracks = (pl.tracks || []).map(tid => tracks.find(x => x.id === tid)).filter(Boolean);
                                                const isCurrentPlaylistPlaying = activeQueueName === `Playlist: ${pl.name}` && isPlaying;

                                                return (
                                                    <div key={pl.id} className="p-5 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-4 hover:border-slate-700 transition">
                                                        <div className="flex items-center justify-between">
                                                            <div>
                                                                <h3 className="font-bold text-base text-slate-100 flex items-center space-x-2">
                                                                    <span>{pl.name}</span>
                                                                    {isCurrentPlaylistPlaying && (
                                                                        <span className="text-[10px] bg-brand-500/20 text-brand-400 px-2 py-0.5 rounded-full font-extrabold animate-pulse">
                                                                            PLAYING
                                                                        </span>
                                                                    )}
                                                                </h3>
                                                                <p className="text-xs text-slate-400 mt-0.5">{plTracks.length} Tracks</p>
                                                            </div>
                                                            
                                                            {/* Playlist Quick Action Controls */}
                                                            <div className="flex items-center space-x-2">
                                                                <button 
                                                                    onClick={() => playPlaylist(pl, 'all')}
                                                                    className="bg-brand-500 hover:bg-brand-600 text-slate-950 px-3 py-1.5 rounded-xl text-xs font-extrabold flex items-center space-x-1.5 shadow transition"
                                                                    title="Play Playlist with Auto-Repeat"
                                                                >
                                                                    <Icon name="play" className="w-3.5 h-3.5" fill="currentColor" />
                                                                    <span>Auto-Loop</span>
                                                                </button>
                                                            </div>
                                                        </div>

                                                        {/* Track List inside Playlist */}
                                                        <div className="space-y-1.5 pt-2 border-t border-slate-800/60">
                                                            {plTracks.length === 0 ? (
                                                                <p className="text-xs text-slate-500 italic py-2">No tracks added to this playlist yet.</p>
                                                            ) : (
                                                                plTracks.slice(0, 4).map((t, idx) => (
                                                                    <div 
                                                                        key={t.id} 
                                                                        onClick={() => playTrack(t, plTracks, `Playlist: ${pl.name}`)}
                                                                        className="flex items-center justify-between p-2 rounded-lg bg-slate-800/40 hover:bg-slate-800 text-xs cursor-pointer transition group"
                                                                    >
                                                                        <div className="flex items-center space-x-2.5 truncate">
                                                                            <span className="text-[10px] text-slate-500 font-mono w-4">{idx + 1}</span>
                                                                            <span className="font-medium text-slate-200 group-hover:text-brand-400 truncate">{t.title}</span>
                                                                            <span className="text-slate-500 truncate">- {t.artist}</span>
                                                                        </div>
                                                                        <Icon name="play" className="w-3.5 h-3.5 text-slate-500 group-hover:text-brand-400 shrink-0" fill="currentColor" />
                                                                    </div>
                                                                ))
                                                            )}
                                                            {plTracks.length > 4 && (
                                                                <p className="text-[11px] text-slate-500 pt-1 text-center">+ {plTracks.length - 4} more tracks</p>
                                                            )}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    )}
                                </div>
                            )}

                            {/* CYBERDUCK & R2 SETUP GUIDE TAB */}
                            {activeTab === 'r2guide' && (
                                <div className="space-y-6 max-w-4xl mx-auto">
                                    <div className="bg-slate-900/80 rounded-3xl p-6 border border-slate-800 space-y-4">
                                        <div className="flex items-center space-x-3 border-b border-slate-800 pb-4">
                                            <div className="w-12 h-12 rounded-2xl bg-brand-accent/20 border border-brand-accent/30 flex items-center justify-center text-brand-accent">
                                                <Icon name="folder-git-2" className="w-6 h-6" />
                                            </div>
                                            <div>
                                                <h3 className="text-xl font-bold">Cyberduck & Cloudflare R2 Connection Blueprint</h3>
                                                <p className="text-xs text-slate-400">Step-by-step guide to connect Cyberduck S3 client to your R2 bucket</p>
                                            </div>
                                        </div>

                                        <div className="space-y-4 text-xs text-slate-300 leading-relaxed">
                                            <div className="p-4 bg-slate-800/60 rounded-xl space-y-2">
                                                <h4 className="font-bold text-sm text-brand-400">Step 1: Get R2 Credentials from Cloudflare Dashboard</h4>
                                                <p>1. Go to Cloudflare Dashboard → <b>R2 Object Storage</b>.</p>
                                                <p>2. Click <b>Manage R2 API Tokens</b> → Create API Token.</p>
                                                <p>3. Select <b>Edit permissions</b> and copy your <b>Access Key ID</b>, <b>Secret Access Key</b>, and Endpoint URL.</p>
                                            </div>

                                            <div className="p-4 bg-slate-800/60 rounded-xl space-y-2">
                                                <h4 className="font-bold text-sm text-brand-accent">Step 2: Cyberduck Connection Parameters</h4>
                                                <div className="font-mono bg-slate-950 p-3 rounded-lg border border-slate-800 text-[11px] space-y-1">
                                                    <p><b>Profile Type:</b> S3 (HTTPS) / Amazon S3</p>
                                                    <p><b>Server / Endpoint:</b> &lt;ACCOUNT_ID&gt;.r2.cloudflarestorage.com</p>
                                                    <p><b>Port:</b> 443</p>
                                                    <p><b>Access Key ID:</b> &lt;YOUR_R2_ACCESS_KEY&gt;</p>
                                                    <p><b>Secret Access Key:</b> &lt;YOUR_R2_SECRET_KEY&gt;</p>
                                                </div>
                                            </div>

                                            <div className="p-4 bg-slate-800/60 rounded-xl space-y-2">
                                                <h4 className="font-bold text-sm text-purple-400">Step 3: Enable Public Domain in R2</h4>
                                                <p>In your R2 bucket settings, turn on <b>R2.dev Public Bucket URL</b> or connect your custom domain (e.g. <code>https://pub-xxx.r2.dev</code>). Use this URL format inside the Manager Upload Studio!</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {/* COMPLETE MANAGER / ADMIN STUDIO */}
                            {activeTab === 'manager' && (
                                <div className="space-y-6 max-w-6xl mx-auto">
                                    {!isManager ? (
                                        <div className="rounded-3xl border border-purple-500/20 bg-purple-500/5 p-10 text-center">
                                            <Icon name="lock" className="w-12 h-12 text-purple-400 mx-auto mb-4" />
                                            <h2 className="text-2xl font-bold">Manager access required</h2>
                                            <p className="text-sm text-slate-400 mt-2">Sign in with {PRIMARY_MANAGER} or an assigned manager account.</p>
                                            <button onClick={() => setShowAuthModal(true)} className="mt-5 px-5 py-2.5 rounded-xl bg-purple-500 text-white font-bold text-sm">Open Manager Gate</button>
                                        </div>
                                    ) : (
                                        <>
                                            <div className="grid lg:grid-cols-3 gap-5">
                                                <form onSubmit={handleTrackUpload} className="lg:col-span-2 rounded-3xl border border-slate-800 bg-slate-900/80 p-6 space-y-4">
                                                    <div className="flex items-center gap-3 border-b border-slate-800 pb-4">
                                                        <Icon name="cloud-upload" className="w-7 h-7 text-brand-500" />
                                                        <div><h2 className="text-xl font-bold">Publish media</h2><p className="text-xs text-slate-400">Select a computer file or add a public R2 URL.</p></div>
                                                    </div>
                                                    <div className="grid sm:grid-cols-2 gap-3">
                                                        <input required value={uploadForm.title} onChange={e => setUploadForm({...uploadForm, title:e.target.value})} placeholder="Media title" className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                                                        <input required value={uploadForm.artist} onChange={e => setUploadForm({...uploadForm, artist:e.target.value})} placeholder="Creator / artist" className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                                                        <input value={uploadForm.album} onChange={e => setUploadForm({...uploadForm, album:e.target.value})} placeholder="Album / collection" className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                                                        <select value={uploadForm.genre} onChange={e => setUploadForm({...uploadForm, genre:e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm">{genresList.slice(1).map(g => <option key={g}>{g}</option>)}</select>
                                                        <select value={uploadForm.type} onChange={e => setUploadForm({...uploadForm, type:e.target.value})} className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm"><option value="audio">Audio</option><option value="video">Video</option></select>
                                                        <input value={uploadForm.cover} onChange={e => setUploadForm({...uploadForm, cover:e.target.value})} placeholder="Cover image URL (optional)" className="bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                                                    </div>
                                                    <div className="rounded-2xl border border-cyan-500/25 bg-cyan-500/5 p-4 space-y-3">
                                                        <div><h3 className="text-sm font-bold text-cyan-300">Cloudflare R2 connection</h3><p className="text-[11px] text-slate-500 mt-1">Deploy the included Worker, then enter its URL and the Worker secret token. R2 API keys never go in this page.</p></div>
                                                        <input type="url" value={r2Config.workerUrl} onChange={e => { const value=e.target.value; setR2Config(prev=>({...prev,workerUrl:value})); localStorage.setItem('emostream_r2_worker_url',value); }} placeholder="https://emostream-r2-upload.your-name.workers.dev" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                                                        <input type="password" value={r2Config.uploadToken} onChange={e => { const value=e.target.value; setR2Config(prev=>({...prev,uploadToken:value})); sessionStorage.setItem('emostream_r2_upload_token',value); }} placeholder="Worker upload token (stored for this browser tab only)" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm" />
                                                        <div className="flex items-center gap-3"><button type="button" onClick={testR2Connection} className="px-4 py-2 rounded-lg bg-cyan-500/15 border border-cyan-500/30 text-cyan-300 text-xs font-bold">Test R2 connection</button><span className={`text-xs ${r2TestStatus.startsWith('✓') ? 'text-brand-400' : 'text-slate-400'}`}>{r2TestStatus}</span></div>
                                                    </div>
                                                    <div className="rounded-2xl border border-dashed border-brand-500/40 bg-brand-500/5 p-4">
                                                        <input ref={mediaFileRef} type="file" accept="audio/*,video/*,.mp3,.wav,.m4a,.aac,.ogg,.flac,.mp4,.webm,.mov" onChange={handleComputerMedia} className="hidden" />
                                                        <button type="button" onClick={() => mediaFileRef.current?.click()} className="w-full flex items-center justify-center gap-2 rounded-xl bg-brand-500/15 border border-brand-500/30 text-brand-400 font-bold py-3 hover:bg-brand-500/25 transition"><Icon name="upload-cloud" className="w-5 h-5" /><span>Upload audio / video from computer</span></button>
                                                        {selectedLocalFile && <div className="mt-3 flex items-center justify-between gap-3 text-xs"><div className="min-w-0"><p className="font-bold text-slate-200 truncate">{selectedLocalFile.name}</p><p className="text-slate-500">{(selectedLocalFile.size / 1024 / 1024).toFixed(2)} MB · will save to Firebase Storage</p></div><button type="button" onClick={() => { setSelectedLocalFile(null); if (mediaFileRef.current) mediaFileRef.current.value=''; }} className="text-rose-400 font-bold shrink-0">Remove</button></div>}
                                                    </div>
                                                    <div className="flex items-center gap-3"><div className="h-px bg-slate-800 flex-1"></div><span className="text-[10px] uppercase tracking-widest text-slate-500">or use cloud URL</span><div className="h-px bg-slate-800 flex-1"></div></div>
                                                    <input type="url" disabled={!!selectedLocalFile} value={uploadForm.url} onChange={e => { const url=e.target.value; setUploadForm({...uploadForm, url, type: inferMediaType(url, uploadForm.type)}); }} placeholder="Public R2 audio / video URL" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-4 py-3 text-sm disabled:opacity-40" />
                                                    {uploading && <div className="space-y-2"><div className="h-2 rounded-full bg-slate-800 overflow-hidden"><div className="h-full bg-brand-500 transition-all" style={{width: uploadProgress + '%'}}></div></div><div className="flex items-center justify-between gap-3"><p className="text-xs text-brand-400">{uploadStatus}</p><button type="button" onClick={cancelUpload} className="text-xs text-rose-400 font-bold">Cancel upload</button></div></div>}
                                                    <button disabled={uploading} className="w-full bg-brand-500 hover:bg-brand-600 disabled:opacity-50 text-slate-950 font-extrabold py-3 rounded-xl">{uploading ? `Publishing ${uploadProgress}%` : 'Publish media'}</button>
                                                </form>

                                                <section className="rounded-3xl border border-slate-800 bg-slate-900/80 p-6 space-y-4">
                                                    <div className="flex items-center gap-3"><button onClick={() => avatarFileRef.current?.click()} className="w-14 h-14 rounded-2xl bg-slate-800 overflow-hidden flex items-center justify-center text-brand-400 font-bold shrink-0">{avatar ? <img src={avatar} alt="Avatar" className="w-full h-full object-cover" /> : user?.email?.substring(0,2).toUpperCase()}</button><div><h2 className="font-bold">Manager accounts</h2><p className="text-xs text-slate-400 mt-1">Click the avatar to upload PNG, JPG, WEBP or GIF (max 2 MB).</p></div></div>
                                                    <div className="space-y-2 max-h-44 overflow-auto">{managers.map(email => <div key={email} className="text-xs bg-slate-950 border border-slate-800 px-3 py-2 rounded-lg truncate">{email}</div>)}</div>
                                                    {user?.email?.toLowerCase() === PRIMARY_MANAGER ? <><input type="email" value={newManagerEmail} onChange={e => setNewManagerEmail(e.target.value)} placeholder="manager@example.com" className="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2.5 text-sm" /><button onClick={addManagerAccount} className="w-full bg-purple-500 hover:bg-purple-600 text-white font-bold py-2.5 rounded-xl text-sm">Assign manager</button></> : <p className="text-xs text-amber-300 bg-amber-500/10 border border-amber-500/20 rounded-xl p-3">Only the primary manager can assign another manager account.</p>}
                                                </section>
                                            </div>

                                            <section className="rounded-3xl border border-slate-800 bg-slate-900/80 p-6">
                                                <div className="flex items-center justify-between mb-4"><div><h2 className="text-lg font-bold">Catalog administration</h2><p className="text-xs text-slate-400">Delete individual media items and remove them from every local playlist.</p></div><span className="text-xs text-slate-400">{tracks.length} items</span></div>
                                                <div className="space-y-2">{tracks.map(track => <div key={track.id} className="flex items-center gap-3 bg-slate-950/70 border border-slate-800 rounded-xl p-3"><img src={track.cover} alt="" className="w-11 h-11 rounded-lg object-cover" /><div className="min-w-0 flex-1"><p className="text-sm font-bold truncate">{track.title}</p><p className="text-xs text-slate-500 truncate">{track.artist} · {track.type} · {track.savedToCloud || (!track.localBlobId && !track.url?.startsWith('blob:')) ? '☁ Cloud saved' : '💻 Browser saved'}</p></div><button onClick={() => deleteTrack(track.id)} className="px-3 py-2 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-bold hover:bg-rose-500/20">Delete</button></div>)}</div>
                                            </section>

                                            <section className="rounded-3xl border border-slate-800 bg-slate-900/80 p-6">
                                                <h2 className="text-lg font-bold mb-4">Playlist administration</h2>
                                                {playlists.length === 0 ? <p className="text-sm text-slate-500">No playlists yet.</p> : <div className="grid sm:grid-cols-2 gap-3">{playlists.map(pl => <div key={pl.id} className="flex items-center justify-between bg-slate-950/70 border border-slate-800 rounded-xl p-3"><div><p className="text-sm font-bold">{pl.name}</p><p className="text-xs text-slate-500">{(pl.tracks || []).length} items</p></div><button onClick={() => deletePlaylist(pl.id)} className="text-xs text-rose-400 font-bold">Delete</button></div>)}</div>}
                                            </section>
                                        </>
                                    )}
                                </div>
                            )}

                        </div>

                        {/* Bottom Floating Interactive Player Bar */}
                        {currentTrack && (
                            <div className="absolute bottom-0 left-0 right-0 h-24 bg-slate-950/95 border-t border-slate-800 backdrop-blur-xl px-6 flex items-center justify-between z-30">
                                
                                {/* Track Info & Active Queue Badge */}
                                <div className="flex items-center space-x-4 w-1/4 min-w-[200px]">
                                    <div className="relative group shrink-0">
                                        <img src={currentTrack.cover} className="w-14 h-14 rounded-xl object-cover shadow-lg" />
                                        {currentTrack.type === 'video' && (
                                            <button 
                                                onClick={() => setShowVideoModal(true)}
                                                className="absolute inset-0 bg-slate-950/60 rounded-xl flex items-center justify-center text-white opacity-0 group-hover:opacity-100 transition"
                                                title="Open Video Player"
                                            >
                                                <Icon name="maximize-2" className="w-5 h-5" />
                                            </button>
                                        )}
                                    </div>
                                    <div className="truncate">
                                        <h4 className="font-bold text-sm text-slate-100 truncate">{currentTrack.title}</h4>
                                        <p className="text-xs text-slate-400 truncate">{currentTrack.artist}</p>
                                        <span className="text-[10px] text-brand-400 font-semibold bg-brand-500/10 border border-brand-500/20 px-2 py-0.5 rounded-full inline-block mt-0.5 truncate max-w-[150px]">
                                            🎵 {activeQueueName}
                                        </span>
                                    </div>
                                    <button onClick={() => toggleFavorite(currentTrack.id)} className={`p-1.5 shrink-0 ${favorites.includes(currentTrack.id) ? 'text-rose-500' : 'text-slate-500'}`}>
                                        <Icon name="heart" className="w-4 h-4" fill={favorites.includes(currentTrack.id) ? "currentColor" : "none"} />
                                    </button>
                                </div>

                                {/* Main Player Scrubbing Controls */}
