                                <div className="flex flex-col items-center max-w-xl w-full px-4 space-y-2">
                                    <div className="flex items-center space-x-6">
                                        
                                        {/* Shuffle Toggle */}
                                        <button 
                                            onClick={() => setIsShuffle(!isShuffle)}
                                            className={`p-2 rounded-xl transition relative ${isShuffle ? 'bg-brand-500/20 text-brand-400 border border-brand-500/40 shadow-sm' : 'text-slate-500 hover:text-slate-300'}`}
                                            title={isShuffle ? "Shuffle Mode Enabled" : "Shuffle Play Disabled"}
                                        >
                                            <Icon name="shuffle" className="w-4 h-4" />
                                            {isShuffle && (
                                                <span className="absolute -top-1 -right-1 w-2 h-2 rounded-full bg-brand-500 animate-ping"></span>
                                            )}
                                        </button>

                                        {/* Previous Track */}
                                        <button onClick={handlePrev} className="text-slate-300 hover:text-white transition">
                                            <Icon name="skip-back" className="w-5 h-5" fill="currentColor" />
                                        </button>

                                        {/* Play/Pause Main */}
                                        <button 
                                            onClick={togglePlay}
                                            className="w-11 h-11 rounded-full bg-brand-500 text-slate-950 flex items-center justify-center hover:scale-105 transition shadow-lg glow-effect"
                                        >
                                            <Icon name={isPlaying ? "pause" : "play"} className="w-5 h-5" fill="currentColor" />
                                        </button>

                                        {/* Next Track */}
                                        <button onClick={handleNext} className="text-slate-300 hover:text-white transition">
                                            <Icon name="skip-forward" className="w-5 h-5" fill="currentColor" />
                                        </button>

                                        {/* Repeat Mode Switcher (OFF -> PLAYLIST LOOP ALL -> SINGLE TRACK LOOP 1) */}
                                        <button 
                                            onClick={() => {
                                                if (repeatMode === 'off') setRepeatMode('all');
                                                else if (repeatMode === 'all') setRepeatMode('one');
                                                else setRepeatMode('off');
                                            }}
                                            className={`p-2 rounded-xl transition relative ${repeatMode !== 'off' ? 'bg-brand-500/20 text-brand-400 border border-brand-500/40 shadow-sm' : 'text-slate-500 hover:text-slate-300'}`}
                                            title={`Repeat Mode: ${repeatMode === 'one' ? 'Single Track Loop' : repeatMode === 'all' ? 'Playlist Auto-repeat' : 'Off'}`}
                                        >
                                            <Icon name="repeat" className="w-4 h-4" />
                                            {repeatMode === 'one' && (
                                                <span className="absolute -top-1.5 -right-1.5 text-[9px] font-extrabold bg-brand-500 text-slate-950 rounded-full w-4 h-4 flex items-center justify-center shadow">1</span>
                                            )}
                                            {repeatMode === 'all' && (
                                                <span className="absolute -top-1.5 -right-1.5 text-[8px] font-extrabold bg-brand-500 text-slate-950 rounded-full px-1 py-0.2 flex items-center justify-center shadow">ALL</span>
                                            )}
                                        </button>
                                    </div>

                                    {/* Timeline Slider */}
                                    <div className="w-full flex items-center space-x-3 text-xs font-mono text-slate-400">
                                        <span>{formatTime(currentTime)}</span>
                                        <input 
                                            type="range"
                                            min="0"
                                            max={duration || 100}
                                            value={currentTime}
                                            onChange={handleSeek}
                                            className="flex-1 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-brand-500"
                                        />
                                        <span>{formatTime(duration)}</span>
                                    </div>
                                </div>

                                {/* Volume & Video Stage Actions */}
                                <div className="flex items-center justify-end space-x-4 w-1/4 min-w-[180px]">
                                    {currentTrack.type === 'video' && (
                                        <button 
                                            onClick={() => setShowVideoModal(!showVideoModal)}
                                            className="px-2.5 py-1 rounded-lg bg-indigo-500/20 text-indigo-400 border border-indigo-500/30 text-xs font-bold flex items-center space-x-1"
                                        >
                                            <Icon name="tv" className="w-3.5 h-3.5" />
                                            <span>Video Stage</span>
                                        </button>
                                    )}

                                    <div className="flex items-center space-x-2">
                                        <button onClick={() => setIsMuted(!isMuted)} className="text-slate-400 hover:text-white">
                                            <Icon name={isMuted || volume === 0 ? "volume-x" : "volume-2"} className="w-4 h-4" />
                                        </button>
                                        <input 
                                            type="range" 
                                            min="0" 
                                            max="1" 
                                            step="0.01" 
                                            value={isMuted ? 0 : volume} 
                                            onChange={handleVolumeChange}
                                            className="w-20 h-1 bg-slate-800 rounded-lg appearance-none cursor-pointer accent-brand-500"
                                        />
                                    </div>
                                </div>
                            </div>
                        )}

                    </main>

                    {/* Video Player Modal */}
                    {showVideoModal && currentTrack?.type === 'video' && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex flex-col items-center justify-center p-6">
                            <div className="w-full max-w-4xl bg-slate-900 border border-slate-800 rounded-3xl overflow-hidden shadow-2xl relative">
                                <div className="p-4 border-b border-slate-800 flex items-center justify-between">
                                    <div className="flex items-center space-x-3">
                                        <span className="w-3 h-3 rounded-full bg-rose-500 animate-pulse"></span>
                                        <h3 className="font-bold text-sm">{currentTrack.title} - Video Stage</h3>
                                    </div>
                                    <button onClick={() => setShowVideoModal(false)} className="text-slate-400 hover:text-white p-1">✕</button>
                                </div>
                                <div className="relative aspect-video bg-black">
                                    <video 
                                        ref={videoRef}
                                        src={currentTrack.url}
                                        className="w-full h-full object-contain"
                                        onTimeUpdate={handleTimeUpdate}
                                        onEnded={handleTrackEnded}
                                        controls
                                    />
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Add to Playlist Modal */}
                    {selectedTrackForPlaylist && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4">
                                <h3 className="font-bold text-lg">Add "{selectedTrackForPlaylist.title}" to Playlist</h3>
                                <div className="space-y-2 max-h-60 overflow-y-auto">
                                    {playlists.map(pl => (
                                        <button 
                                            key={pl.id}
                                            onClick={() => addTrackToPlaylist(pl.id, selectedTrackForPlaylist.id)}
                                            className="w-full p-3 bg-slate-800/60 hover:bg-slate-700/80 rounded-xl text-left text-xs font-semibold flex items-center justify-between"
                                        >
                                            <span>{pl.name}</span>
                                            <Icon name="plus" className="w-4 h-4" />
                                        </button>
                                    ))}
                                </div>
                                <button onClick={() => setSelectedTrackForPlaylist(null)} className="w-full py-2 bg-slate-800 text-slate-300 rounded-xl text-xs font-bold">
                                    Cancel
                                </button>
                            </div>
                        </div>
                    )}

                    {/* Create Playlist Modal */}
                    {showCreatePlaylist && (
                        <div className="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 max-w-md w-full space-y-4">
                                <h3 className="font-bold text-lg">Create Custom Playlist</h3>
                                <form onSubmit={(e) => { e.preventDefault(); createPlaylist(); }} className="space-y-4">
                                    <input 
                                        type="text" 
                                        value={newPlaylistName} 
                                        onChange={(e) => setNewPlaylistName(e.target.value)} 
                                        placeholder="Playlist Name (e.g. Night Driving)" 
                                        className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-100 focus:outline-none focus:border-brand-500"
                                        autoFocus
                                    />
                                    <div className="flex space-x-2">
                                        <button type="submit" className="flex-1 bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-2.5 rounded-xl text-xs transition">Create</button>
                                        <button type="button" onClick={() => setShowCreatePlaylist(false)} className="flex-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold py-2.5 rounded-xl text-xs transition">Cancel</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Manager Auth Modal */}
                    {showAuthModal && (
                        <div className="fixed inset-0 bg-slate-950/90 backdrop-blur-2xl z-50 flex items-center justify-center p-4">
                            <div className="bg-slate-900 border border-slate-800 rounded-3xl p-8 max-w-md w-full space-y-6 shadow-2xl relative">
                                <button 
                                    onClick={() => setShowAuthModal(false)}
                                    className="absolute top-4 right-4 text-slate-400 hover:text-white p-2 text-sm"
                                    title="Close"
                                >
                                    ✕
                                </button>

                                <div className="text-center space-y-2">
                                    <div className="w-12 h-12 rounded-2xl bg-brand-500/10 border border-brand-500/20 text-brand-500 flex items-center justify-center mx-auto">
                                        <Icon name="lock" className="w-6 h-6" />
                                    </div>
                                    <h3 className="text-2xl font-extrabold text-white">Manager Authentication</h3>
                                    <p className="text-xs text-slate-400">
                                        Strictly restricted to <code className="text-brand-400">{PRIMARY_MANAGER}</code> & assigned manager accounts.
                                    </p>
                                </div>

                                {authError && (
                                    <div className="p-3 bg-rose-500/10 border border-rose-500/20 text-rose-400 rounded-xl text-xs font-semibold">
                                        {authError}
                                    </div>
                                )}

                                <form onSubmit={handleAuth} className="space-y-4">
                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Email Address</label>
                                        <input 
                                            type="email" 
                                            required
                                            value={emailInput}
                                            onChange={(e) => setEmailInput(e.target.value)}
                                            placeholder="hayashirika05@gmail.com"
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500"
                                        />
                                    </div>

                                    <div>
                                        <label className="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                                        <input 
                                            type="password" 
                                            required
                                            value={passwordInput}
                                            onChange={(e) => setPasswordInput(e.target.value)}
                                            placeholder="••••••••"
                                            className="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-brand-500"
                                        />
                                    </div>

                                    <button 
                                        type="submit"
                                        className="w-full py-3 bg-brand-500 hover:bg-brand-600 text-slate-950 font-extrabold rounded-xl text-xs shadow-lg transition"
                                    >
                                        {authMode === 'login' ? 'Authenticate & Enter' : 'Register Manager Account'}
                                    </button>
                                </form>

                                <div className="text-center pt-2 space-y-2">
                                    <div>
                                        <button 
                                            onClick={() => setAuthMode(authMode === 'login' ? 'register' : 'login')}
                                            className="text-xs text-slate-400 hover:text-white underline"
                                        >
                                            {authMode === 'login' ? 'Need to register authorized manager?' : 'Already registered? Switch to Sign In'}
                                        </button>
                                    </div>
                                    <div>
                                        <button 
                                            onClick={() => setShowAuthModal(false)}
                                            className="text-xs text-slate-500 hover:text-slate-300"
                                        >
                                            Continue as Guest Listener →
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<App />);
    </script>
</body>
</html>
