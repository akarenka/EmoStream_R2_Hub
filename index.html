            const [visible, setVisible] = useState(false);

            // 進入網頁 1 秒後開啟廣告
            useEffect(() => {
                const timer = setTimeout(() => setVisible(true), 1000);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (!visible) return;

                setCountdown(TOTAL_COUNTDOWN);
                const interval = setInterval(() => {
                    setCountdown((prev) => {
                        if (prev <= 1) {
                            clearInterval(interval);
                            return 0; // 倒數結束，解鎖 Skip 按鈕

                        return prev - 1;
                    });

        const mediaDb = {
            open() {
                return new Promise((resolve, reject) => {
                    const request = indexedDB.open('EmoStreamMediaDB', 1);
                    request.onupgradeneeded = () => {
                        if (!request.result.objectStoreNames.contains('media')) request.result.createObjectStore('media');
                    };
                    request.onsuccess = () => resolve(request.result);
                    request.onerror = () => reject(request.error);
                });
            },
            async put(id, blob) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('media', 'readwrite');
                    tx.objectStore('media').put(blob, id);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            },
            async get(id) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const request = db.transaction('media').objectStore('media').get(id);
                    request.onsuccess = () => resolve(request.result || null);
                    request.onerror = () => reject(request.error);
                });
            },
            async remove(id) {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('media', 'readwrite');
                    tx.objectStore('media').delete(id);
                    tx.oncomplete = resolve;
                    tx.onerror = () => reject(tx.error);
                });
            },
            async keys() {
                const db = await this.open();
                return new Promise((resolve, reject) => {
                    const request = db.transaction('media').objectStore('media').getAllKeys();
                    request.onsuccess = () => resolve(request.result || []);
                    request.onerror = () => reject(request.error);
                });
            }
        };

        function inferMediaType(value, fallback = 'audio') {
            const lower = String(value || '').toLowerCase().split('?')[0].split('#')[0];
            const videoExtensions = ['.mp4', '.webm', '.mov', '.m4v', '.ogv', '.avi', '.mkv'];
            const audioExtensions = ['.mp3', '.wav', '.m4a', '.aac', '.ogg', '.flac', '.opus'];
            if (videoExtensions.some(extension => lower.endsWith(extension))) return 'video';
            if (audioExtensions.some(extension => lower.endsWith(extension))) return 'audio';
            return fallback === 'video' ? 'video' : 'audio';
        }

        function normalizeTrack(track) {
            if (!track) return track;
            const source = track.localFileName || track.url || track.title || '';
            return { ...track, type: inferMediaType(source, track.type) };
        }

            const [authError, setAuthError] = useState('');
            const [authMode, setAuthMode] = useState('login');
            const [showAuthModal, setShowAuthModal] = useState(false);
            const [managers, setManagers] = useState([PRIMARY_MANAGER]);

            // Application Data States
            const [tracks, setTracks] = useState(() => {
                try { const value = JSON.parse(localStorage.getItem(LOCAL_TRACKS_KEY) || 'null'); return Array.isArray(value) && value.length ? value.map(normalizeTrack) : SAMPLE_TRACKS; }
                catch { return SAMPLE_TRACKS; }
            });
            const [favorites, setFavorites] = useState(() => {
                try { const value = JSON.parse(localStorage.getItem(LOCAL_FAVORITES_KEY) || '[]'); return Array.isArray(value) ? value : []; }
                catch { return []; }
            });
            const [playlists, setPlaylists] = useState(() => {
                try { const value = JSON.parse(localStorage.getItem(LOCAL_PLAYLISTS_KEY) || '[]'); return Array.isArray(value) ? value : []; }
                catch { return []; }
            });
            const [activeTab, setActiveTab] = useState('home');
            
            // Queue & Navigation
            const [activeQueue, setActiveQueue] = useState(null);
            const [activeQueueName, setActiveQueueName] = useState('All Tracks');

            // Search & Filter
            const [searchQuery, setSearchQuery] = useState('');
            const [selectedGenre, setSelectedGenre] = useState('All');

            // Player Logic
            const [currentTrack, setCurrentTrack] = useState(null);
            const [isPlaying, setIsPlaying] = useState(false);
            const [currentTime, setCurrentTime] = useState(0);
            const [duration, setDuration] = useState(0);
            const [volume, setVolume] = useState(0.8);
            const [isMuted, setIsMuted] = useState(false);
            const [repeatMode, setRepeatMode] = useState('off');
            const [isShuffle, setIsShuffle] = useState(false);
            const [showVideoModal, setShowVideoModal] = useState(false);

            // Cloudflare R2 Settings
            const [r2Config, setR2Config] = useState(() => ({
                workerUrl: localStorage.getItem('emostream_r2_worker_url') || '',
                uploadToken: sessionStorage.getItem('emostream_r2_upload_token') || ''
            }));

            // UI Modal States
            const [newPlaylistName, setNewPlaylistName] = useState('');
            const [showCreatePlaylist, setShowCreatePlaylist] = useState(false);
            const [selectedTrackForPlaylist, setSelectedTrackForPlaylist] = useState(null);
            const [newManagerEmail, setNewManagerEmail] = useState('');

            // Upload Form State
            const [uploadForm, setUploadForm] = useState({
                title: '',
                artist: '',
                album: '',
                genre: 'J-Pop',
                type: 'audio',
                url: '',
                cover: ''
            });
            const [uploading, setUploading] = useState(false);
            const [uploadProgress, setUploadProgress] = useState(0);
            const [uploadStatus, setUploadStatus] = useState('');
            const [r2TestStatus, setR2TestStatus] = useState('');
            const [selectedLocalFile, setSelectedLocalFile] = useState(null);
            const [avatar, setAvatar] = useState(() => localStorage.getItem(LOCAL_AVATAR_KEY) || '');

            // References
            const audioRef = useRef(null);
            const videoRef = useRef(null);
            const mediaFileRef = useRef(null);
            const avatarFileRef = useRef(null);
            const activeUploadTaskRef = useRef(null);
            const uploadCancelledRef = useRef(false);

            useEffect(() => {
                const restoreLocalFiles = async () => {
                    const saved = JSON.parse(localStorage.getItem(LOCAL_TRACKS_KEY) || '[]');
                    if (!Array.isArray(saved)) return;
                    const restored = await Promise.all(saved.map(async track => {
                        if (!track.localBlobId) return normalizeTrack(track);
                        try {
                            const blob = await mediaDb.get(track.localBlobId);
                            return blob ? normalizeTrack({ ...track, url: URL.createObjectURL(blob), unavailable: false }) : normalizeTrack({ ...track, unavailable: true });
                        } catch (error) {
                            return { ...track, unavailable: true };
                        }
                    }));
                    const knownBlobIds = new Set(restored.map(track => track.localBlobId).filter(Boolean));
                    const recovered = [];
                    try {
                        const keys = await mediaDb.keys();
                        for (const key of keys) {
                            if (knownBlobIds.has(key)) continue;
                            const blob = await mediaDb.get(key);
                            if (!blob) continue;
                            const filename = blob.name || `Recovered media ${recovered.length + 1}`;
                            recovered.push(normalizeTrack({
                                id: `recovered-${String(key)}`,
                                title: filename.replace(/\.[^.]+$/, ''),
                                artist: 'Recovered upload',
                                album: 'Browser recovery',
                                genre: 'Other',
                                type: inferMediaType(filename, blob.type?.startsWith('video/') ? 'video' : 'audio'),
                                url: URL.createObjectURL(blob),
                                cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=600&auto=format&fit=crop&q=80',
                                localBlobId: key,
                                localFileName: filename,
                                timestamp: Date.now() - recovered.length,
                                recovered: true
                            }));
                        }
                    } catch (error) {
                        console.warn('Browser media recovery failed:', error);
                    }
                    if (restored.length || recovered.length) {
                        setTracks(previous => [...restored, ...recovered, ...previous].filter((track, index, list) => list.findIndex(item => item.id === track.id) === index));
                    }
                };
                restoreLocalFiles();
            }, []);

            useEffect(() => { localStorage.setItem(LOCAL_TRACKS_KEY, JSON.stringify(tracks)); }, [tracks]);
            useEffect(() => { localStorage.setItem(LOCAL_FAVORITES_KEY, JSON.stringify(favorites)); }, [favorites]);
            useEffect(() => { localStorage.setItem(LOCAL_PLAYLISTS_KEY, JSON.stringify(playlists)); }, [playlists]);
            useEffect(() => {
                const timeout = setTimeout(() => {
                    if (!window.FB) {
                        setAuthError('Firebase could not load. Check the internet connection and Firebase configuration.');
                        setAuthLoading(false);
                    }
                }, 5000);
                return () => clearTimeout(timeout);
            }, []);

            useEffect(() => {
                if (!window.FB) return;
                const { auth, onAuthStateChanged, signInWithCustomToken, signInAnonymously } = window.FB;

                const initAuth = async () => {
                    if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token && typeof signInWithCustomToken === 'function') {
                        try {
                            await signInWithCustomToken(auth, __initial_auth_token);
                            return;
                        } catch (e) {
                            console.warn("Custom token auth failed, trying fallback", e);
                        }
                    }
                    
                    if (!auth.currentUser && typeof signInAnonymously === 'function') {
                        try {
                            await signInAnonymously(auth);
                        } catch (e) {
                            console.warn("Anonymous auth failed or disabled", e);
                        }
                    }
                };
                initAuth();

                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    if (currentUser) {
                        setUser(currentUser);
                    } else {
                        setUser({ uid: guestId, email: null, isGuest: true });
                    }
                    setAuthLoading(false);
                });

                return () => unsubscribe();
            }, [guestId]);

            useEffect(() => {
                if (!window.FB) return;
                const { db, appId, collection, doc, onSnapshot } = window.FB;

                const managersCol = collection(db, 'artifacts', appId, 'public', 'data', 'managers');
                const unsubscribeManagers = onSnapshot(managersCol, (snap) => {
                    const list = [PRIMARY_MANAGER];
                    snap.forEach(doc => {
                        const data = doc.data();
                        if (data.email && !list.includes(data.email.toLowerCase())) {
                            list.push(data.email.toLowerCase());
                        }
                    });
                    setManagers(list);
                }, (err) => console.error("Managers sub error:", err));

                const songsCol = collection(db, 'artifacts', appId, 'public', 'data', 'songs');
                const unsubscribeSongs = onSnapshot(songsCol, (snap) => {
                    const loadedTracks = [];
                    snap.forEach(doc => {
                        loadedTracks.push(normalizeTrack({ id: doc.id, ...doc.data() }));
                    });
                    if (loadedTracks.length === 0) {
                        const localTracks = JSON.parse(localStorage.getItem(LOCAL_TRACKS_KEY) || '[]');
                        setTracks(Array.isArray(localTracks) && localTracks.length ? localTracks : SAMPLE_TRACKS);
                    } else {
                        const localTracks = JSON.parse(localStorage.getItem(LOCAL_TRACKS_KEY) || '[]');
                        const merged = new Map();
                        if (Array.isArray(localTracks)) localTracks.map(normalizeTrack).forEach(track => merged.set(track.id, track));
                        loadedTracks.forEach(track => merged.set(track.id, track));
                        setTracks(Array.from(merged.values()).sort((a,b) => b.timestamp - a.timestamp));
                    }
                }, (err) => {
                    console.error("Songs sub error:", err);
                    setTracks(previous => previous.length ? previous : SAMPLE_TRACKS);
                });

                if (!user || user.isGuest) return () => { unsubscribeManagers(); unsubscribeSongs(); };

                const favoritesCol = collection(db, 'artifacts', appId, 'users', user.uid, 'favorites');
                const unsubscribeFavorites = onSnapshot(favoritesCol, (snap) => {
                    const favIds = [];
                    snap.forEach(doc => favIds.push(doc.id));
                    setFavorites(favIds);
                }, (err) => console.error("Favorites sub error:", err));

                const playlistsCol = collection(db, 'artifacts', appId, 'users', user.uid, 'playlists');
                const unsubscribePlaylists = onSnapshot(playlistsCol, (snap) => {
                    const lists = [];
                    snap.forEach(doc => lists.push({ id: doc.id, ...doc.data() }));
                    setPlaylists(lists);
                }, (err) => console.error("Playlists sub error:", err));

                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'settings');
                const unsubscribeProfile = onSnapshot(profileRef, (snap) => {
                    if (snap.exists() && snap.data().avatarUrl) {
                        setAvatar(snap.data().avatarUrl);
                        localStorage.setItem(LOCAL_AVATAR_KEY, snap.data().avatarUrl);
                    }
                }, (err) => console.error('Profile sub error:', err));

                return () => {
                    unsubscribeManagers();
                    unsubscribeSongs();
                    unsubscribeFavorites();
                    unsubscribePlaylists();
                    unsubscribeProfile();
                };
            }, [user]);

            const isManager = useMemo(() => {
                if (!user || !user.email) return false;
                const userEmail = user.email.toLowerCase();
                return managers.includes(userEmail);
            }, [user, managers]);

            const playTrack = (track, queue = null, queueName = null, options = {}) => {
                const normalizedTrack = normalizeTrack(track);
                if (queue) {
                    setActiveQueue(queue.map(normalizeTrack));
                    setActiveQueueName(queueName || 'Custom Queue');
                    if (String(queueName || '').startsWith('Playlist:')) setRepeatMode('all');
                } else if (!activeQueue || activeQueue.length === 0) {
                    setActiveQueue(tracks);
                    setActiveQueueName('All Tracks');
                }

                if (currentTrack?.id === normalizedTrack.id) {
                    if (options.forceRestart) {
                        const media = normalizedTrack.type === 'video' ? videoRef.current : audioRef.current;
                        if (media) {
                            media.currentTime = 0;
                            media.play().catch(error => console.log('Restart playback error:', error));
                        }
